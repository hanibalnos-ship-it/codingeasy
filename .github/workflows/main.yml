name: Build ScanVAG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licencas Android
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Instalar Android SDK 33
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

      - name: Compilar ScanVAG
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanVAG-v1.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
